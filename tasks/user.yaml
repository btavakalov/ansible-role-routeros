---
- name: Bootstrap users as default admin
  community.routeros.api_modify:
    username: admin
    password: ""
    path: user
    data: "{{ routeros_users }}"
  failed_when: false
  when: routeros_users is not none

- name: Set users
  community.routeros.api_modify:
    path: user
    data: "{{ routeros_users }}"
    handle_absent_entries: remove
  when: routeros_users is not none

- name: Set user SSH keys
  community.routeros.api_modify:
    path: user ssh-keys
    data: "{{ routeros_user_ssh_keys }}"
    handle_absent_entries: remove
  when: routeros_user_ssh_keys is not none
