---
- name: Read export
  ansible.builtin.command:
    argv: "{{ (['sshpass', '-d', '0'] if routeros_export_ssh_password else [])
              + ['ssh'] + routeros_export_ssh_args
              + [ansible_user ~ '@' ~ ansible_host, routeros_export_command] }}"
    stdin: "{{ routeros_export_ssh_password | default(omit, true) }}"
  register: routeros_export
  no_log: "{{ routeros_export_ssh_password is not none }}"
  changed_when: false
  check_mode: false
  delegate_to: localhost

- name: Create export directory
  ansible.builtin.file:
    path: "{{ routeros_export_dir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  run_once: true
  check_mode: false

- name: Write export
  ansible.builtin.copy:
    content: "{{ routeros_export.stdout_lines | join('\n') }}\n"
    dest: "{{ routeros_export_dir }}/{{ inventory_hostname }}.rsc"
    mode: "0644"
  delegate_to: localhost
  check_mode: false
